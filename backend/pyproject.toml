[project]
name = "snipr-backend"
version = "0.1.0"
description = "Snipr URL shortener — FastAPI backend"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.143.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.uv]
package = false
